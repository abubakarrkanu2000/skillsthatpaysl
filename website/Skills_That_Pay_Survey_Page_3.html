            <a class="back-link" href="Skills_That_Pay_Survey_Page_2.html">← Back</a>
            <p class="progress">QUESTION 3 OF 8</p>
            <form id="survey-form" data-key="skill_interest">
                <fieldset aria-describedby="question-help">
                    <legend id="question-title">Which skill are you most interested in learning?</legend>
                    <p class="helper" id="question-help">Please select one option below, then click Next.</p>
                    <div class="choices">
                    <label class="choice"><input type="radio" name="skill_interest" value="Tech &amp; websites" required><span class="letter" aria-hidden="true">A</span><span>Tech &amp; websites</span></label>
